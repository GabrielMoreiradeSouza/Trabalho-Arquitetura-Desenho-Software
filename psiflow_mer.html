
<style>
#erd { padding: 1rem 0; }
#erd svg { max-width: 100%; }
</style>
<div id="erd"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"Anthropic Sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"Anthropic Sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
    primaryColor: dark ? '#2a2a28' : '#f1efe8',
    primaryBorderColor: dark ? '#5f5e5a' : '#b4b2a9',
    primaryTextColor: dark ? '#c2c0b6' : '#3d3d3a',
  },
});
const diagram = `erDiagram
  USUARIO {
    string id PK
    string nome
    string email
    string senha_hash
    string role
    bool ativo
    datetime criado_em
  }
  PROFISSIONAL {
    string id PK
    string id_usuario FK
    string nome_completo
    string crp
    string especialidade
    string cor_avatar
    string iniciais
  }
  PACIENTE {
    string id PK
    string id_profissional FK
    string nome
    date data_nascimento
    string cpf
    string genero
    string status
    string queixa_inicial
    bool lgpd_aceito
    datetime criado_em
  }
  CONSULTA {
    string id PK
    string id_paciente FK
    string id_profissional FK
    datetime data_hora_inicio
    datetime data_hora_fim
    string tipo
    string status
    string observacao
    bool lembrete_enviado
  }
  SESSAO {
    string id PK
    string id_paciente FK
    string id_profissional FK
    string id_consulta FK
    date data_sessao
    int duracao_minutos
    string titulo
    text conteudo_evolucao
    text plano_terapeutico
    string tags
  }
  PAGAMENTO {
    string id PK
    string id_paciente FK
    string id_sessao FK
    date data_lancamento
    float valor
    string metodo
    string status
  }
  ANAMNESE {
    string id PK
    string id_paciente FK
    text historico_familiar
    text historico_medico
    text medicamentos
    text objetivos_terapeuticos
    datetime atualizado_em
  }
  TAG_CLINICA {
    string id PK
    string nome
    string cor
  }
  PACIENTE_TAG {
    string id_paciente FK
    string id_tag FK
  }
  NOTIFICACAO {
    string id PK
    string id_usuario FK
    string tipo
    string titulo
    string mensagem
    bool lida
    datetime criado_em
  }

  USUARIO ||--o| PROFISSIONAL : "é"
  PROFISSIONAL ||--o{ PACIENTE : "responsável por"
  PROFISSIONAL ||--o{ CONSULTA : "realiza"
  PROFISSIONAL ||--o{ SESSAO : "registra"
  PACIENTE ||--o{ CONSULTA : "possui"
  PACIENTE ||--o{ SESSAO : "acumula"
  PACIENTE ||--o{ PAGAMENTO : "gera"
  PACIENTE ||--|| ANAMNESE : "tem"
  PACIENTE ||--o{ PACIENTE_TAG : "classificada por"
  TAG_CLINICA ||--o{ PACIENTE_TAG : "usada em"
  SESSAO |o--o{ PAGAMENTO : "vinculada a"
  CONSULTA ||--o| SESSAO : "gera"
  USUARIO ||--o{ NOTIFICACAO : "recebe"
`;

const { svg } = await mermaid.render('erd-svg', diagram);
document.getElementById('erd').innerHTML = svg;

document.querySelectorAll('#erd svg.erDiagram .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});

document.querySelectorAll('#erd svg.erDiagram .row-rect-odd path, #erd svg.erDiagram .row-rect-even path').forEach(p => {
  p.setAttribute('stroke', 'none');
});
</script>
